<script>
  (function () {
    function initPhotographyCarousel() {
      const carousels = document.querySelectorAll('.photography-carousel');
      carousels.forEach((carousel) => {
        if (carousel.dataset.carouselReady === 'true') return;
        carousel.dataset.carouselReady = 'true';

        const slides = Array.from(carousel.querySelectorAll('.carousel-item'));
        if (slides.length === 0) return;

        let activeIndex = slides.findIndex((slide) => slide.classList.contains('active'));
        if (activeIndex < 0) activeIndex = 0;

        const showSlide = (nextIndex) => {
          slides[activeIndex].classList.remove('active');
          activeIndex = (nextIndex + slides.length) % slides.length;
          slides[activeIndex].classList.add('active');
        };

        const prevButton = carousel.querySelector('.carousel-control-prev');
        const nextButton = carousel.querySelector('.carousel-control-next');

        if (prevButton) {
          prevButton.addEventListener('click', (event) => {
            event.preventDefault();
            showSlide(activeIndex - 1);
          });
        }

        if (nextButton) {
          nextButton.addEventListener('click', (event) => {
            event.preventDefault();
            showSlide(activeIndex + 1);
          });
        }

        const intervalMs = parseInt(carousel.dataset.bsInterval, 10);
        const autoAdvanceMs = Number.isNaN(intervalMs) ? 4000 : intervalMs;
        if (autoAdvanceMs > 0) {
          setInterval(() => {
            showSlide(activeIndex + 1);
          }, autoAdvanceMs);
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPhotographyCarousel);
    } else {
      initPhotographyCarousel();
    }
  })();
</script>
